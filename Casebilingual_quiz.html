<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>TCM Case Study Practice | 中醫案例測驗練習</title>
<link href="https://fonts.googleapis.com/css2?family=Crimson+Pro:ital,wght@0,400;0,600;0,700;1,400&family=Noto+Sans+TC:wght@400;500;700&family=IBM+Plex+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
:root {
  --sage-dark: #2d4a3e;
  --sage-mid: #4a6b5c;
  --sage-light: #7a9b8a;
  --cream: #faf7f2;
  --ink: #1a1a1a;
  --red: #c1440e;
  --gold: #d4a574;
  --green: #4a7c59;
  --shadow: rgba(45,74,62,0.09);
}
*{margin:0;padding:0;box-sizing:border-box;}
body{font-family:'Noto Sans TC',serif;background:linear-gradient(135deg,var(--cream) 0%,#ede8df 100%);color:var(--ink);line-height:1.7;min-height:100vh;}
.wrap{max-width:1060px;margin:0 auto;padding:40px 20px 100px;}

/* HEADER */
header{text-align:center;padding:55px 20px 40px;border-bottom:2px solid var(--sage-light);margin-bottom:46px;animation:fadeDown .7s ease;}
h1{font-family:'Crimson Pro',serif;font-size:2.9em;font-weight:700;color:var(--sage-dark);letter-spacing:-1px;margin-bottom:8px;}
.sub{font-size:.95em;color:var(--sage-mid);letter-spacing:3px;}

/* CASE TABS */
.tabs{display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:16px;margin-bottom:46px;animation:fadeUp .6s ease .2s backwards;}
.tab{background:#fff;border:2px solid var(--sage-light);padding:22px 20px;border-radius:12px;cursor:pointer;transition:all .35s cubic-bezier(.4,0,.2,1);box-shadow:0 2px 8px var(--shadow);position:relative;overflow:hidden;}
.tab::after{content:'';position:absolute;inset:0;background:linear-gradient(135deg,rgba(122,155,138,.08),transparent);opacity:0;transition:opacity .3s;}
.tab:hover{transform:translateY(-4px);box-shadow:0 8px 22px rgba(45,74,62,.15);border-color:var(--sage-dark);}
.tab:hover::after{opacity:1;}
.tab.active{background:var(--sage-dark);border-color:var(--sage-dark);transform:scale(1.02);}
.tab-title{font-size:1.15em;font-weight:700;color:var(--sage-dark);margin-bottom:5px;}
.tab.active .tab-title,.tab.active .tab-sub{color:#fff;}
.tab-sub{font-size:.85em;color:var(--sage-mid);}

/* CASE PANEL */
.panel{display:none;animation:fadeUp .5s ease;}
.panel.active{display:block;}

/* CASE DESCRIPTION */
.case-desc{background:#fff;padding:28px 32px;border-radius:14px;border-left:5px solid var(--red);margin-bottom:36px;box-shadow:0 3px 10px var(--shadow);font-size:.97em;line-height:1.9;white-space:pre-line;}
.case-desc-label{display:block;font-size:.78em;font-weight:700;color:var(--red);letter-spacing:1.5px;margin-bottom:10px;}

/* QUESTION CARD */
.qcard{background:#fff;border-radius:14px;padding:30px;margin-bottom:22px;box-shadow:0 3px 10px var(--shadow);border:1px solid rgba(122,155,138,.15);transition:box-shadow .2s;}
.qcard:hover{box-shadow:0 6px 20px rgba(45,74,62,.12);}
.q-head{display:flex;gap:14px;align-items:flex-start;margin-bottom:6px;}
.q-num{background:var(--sage-dark);color:#fff;width:38px;height:38px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-family:'IBM Plex Mono',monospace;font-size:.88em;font-weight:500;flex-shrink:0;}
.q-body{flex:1;}
.q-en{font-size:1.05em;font-weight:600;color:var(--sage-dark);line-height:1.55;}
.q-zh{font-size:.88em;color:var(--sage-mid);margin-top:3px;line-height:1.5;}
.multi-badge{display:inline-block;background:#fff3cd;color:#8b6000;border:1px solid #f5c542;border-radius:5px;padding:2px 9px;font-size:.76em;font-weight:600;margin-top:6px;}
.warn-badge{display:inline-block;background:#fde8e0;color:#a33400;border:1px solid #f5b8a0;border-radius:5px;padding:2px 9px;font-size:.76em;font-weight:600;margin-top:4px;}

/* OPTIONS */
.opts{margin:18px 0 4px;}
.opt{display:flex;align-items:flex-start;gap:11px;padding:14px 18px;margin:9px 0;border-radius:9px;cursor:pointer;border:2px solid transparent;background:var(--cream);transition:all .25s ease;user-select:none;}
.opt:hover{background:#ece6dc;transform:translateX(4px);border-color:var(--sage-light);}
.opt-key{font-family:'IBM Plex Mono',monospace;font-weight:700;color:var(--sage-dark);min-width:22px;font-size:.92em;flex-shrink:0;padding-top:1px;}
.opt-content{flex:1;}
.opt-en{font-size:.97em;color:var(--ink);}
.opt-zh{font-size:.82em;color:#666;margin-top:2px;}
.opt.selected{background:var(--sage-light);border-color:var(--sage-dark);}
.opt.selected .opt-key,.opt.selected .opt-en,.opt.selected .opt-zh{color:#fff;}
.opt.correct{background:var(--green);border-color:#3d6b4a;}
.opt.correct .opt-key,.opt.correct .opt-en,.opt.correct .opt-zh{color:#fff;}
.opt.wrong{background:var(--red);border-color:#a33a0c;}
.opt.wrong .opt-key,.opt.wrong .opt-en,.opt.wrong .opt-zh{color:#fff;}
.opt.excluded{opacity:.45;pointer-events:none;}

/* EXPLANATION BOX */
.expl-btn{display:inline-flex;align-items:center;gap:6px;margin-top:14px;padding:7px 16px;background:transparent;border:1.5px solid var(--sage-light);border-radius:20px;cursor:pointer;font-size:.84em;color:var(--sage-mid);font-family:'Noto Sans TC',sans-serif;transition:all .25s ease;}
.expl-btn:hover{background:var(--sage-dark);color:#fff;border-color:var(--sage-dark);}
.expl-btn .arrow{transition:transform .25s;font-size:.75em;}
.expl-btn.open .arrow{transform:rotate(180deg);}
.expl-box{display:none;margin-top:14px;border-radius:10px;overflow:hidden;border:1px solid rgba(122,155,138,.25);}
.expl-box.show{display:block;animation:slideIn .3s ease;}
.expl-en{padding:16px 20px;background:#f6faf8;border-bottom:1px solid rgba(122,155,138,.2);}
.expl-zh{padding:16px 20px;background:#fff;}
.expl-lang{font-size:.72em;font-weight:700;letter-spacing:1.5px;color:var(--sage-light);margin-bottom:6px;display:block;}
.expl-text{font-size:.93em;color:#333;line-height:1.8;}
.expl-text strong{color:var(--sage-dark);}

/* FEEDBACK LINE */
.fb{margin-top:10px;padding:12px 16px;border-radius:8px;font-size:.9em;font-weight:500;display:none;}
.fb.show{display:block;animation:slideIn .3s ease;}
.fb.ok{background:#e8f5e9;color:#2e7d32;border-left:3px solid var(--green);}
.fb.no{background:#fff3e0;color:#8b4513;border-left:3px solid var(--red);}

/* ACTION BUTTONS */
.actions{display:flex;gap:14px;margin-top:44px;justify-content:center;flex-wrap:wrap;}
.btn{padding:14px 34px;border:none;border-radius:10px;font-size:1em;font-weight:600;cursor:pointer;transition:all .3s ease;font-family:'Noto Sans TC',sans-serif;box-shadow:0 3px 10px var(--shadow);}
.btn-pri{background:var(--sage-dark);color:#fff;}
.btn-pri:hover{background:var(--sage-mid);transform:translateY(-2px);}
.btn-sec{background:#fff;color:var(--sage-dark);border:2px solid var(--sage-dark);}
.btn-sec:hover{background:var(--cream);transform:translateY(-2px);}

/* SCORE */
.score-box{background:#fff;padding:36px;border-radius:16px;text-align:center;box-shadow:0 6px 20px rgba(45,74,62,.12);margin:28px 0;border-top:5px solid var(--gold);animation:fadeUp .4s ease;}
.score-box h3{font-family:'Crimson Pro',serif;font-size:1.9em;color:var(--sage-dark);margin-bottom:14px;}
.score-num{font-family:'IBM Plex Mono',monospace;font-size:3.4em;font-weight:500;color:var(--red);margin:10px 0;}
.score-pct{color:var(--sage-mid);font-size:1.05em;}

@keyframes fadeDown{from{opacity:0;transform:translateY(-22px)}to{opacity:1;transform:translateY(0)}}
@keyframes fadeUp{from{opacity:0;transform:translateY(22px)}to{opacity:1;transform:translateY(0)}}
@keyframes slideIn{from{opacity:0;transform:translateX(-14px)}to{opacity:1;transform:translateX(0)}}

.back-top{position:fixed;bottom:28px;right:28px;background:var(--sage-dark);color:#fff;border:none;width:44px;height:44px;border-radius:50%;cursor:pointer;font-size:1.15em;box-shadow:0 4px 14px rgba(45,74,62,.3);transition:all .3s;z-index:99;}
.back-top:hover{transform:translateY(-3px);background:var(--sage-mid);}

@media(max-width:680px){
  h1{font-size:2em;}
  .qcard{padding:22px 16px;}
  .actions{flex-direction:column;}
  .btn{width:100%;}
}
</style>
</head>
<body>
<div class="wrap">
<header>
  <h1>TCM Case Study Practice</h1>
  <p class="sub">中醫案例測驗練習 · BILINGUAL QUIZ</p>
</header>

<div class="tabs" id="tabs"></div>
<div id="panels"></div>
<div class="actions" id="actions" style="display:none;">
  <button class="btn btn-pri" onclick="checkAll()">Check Answers 檢查答案</button>
  <button class="btn btn-sec" onclick="resetAll()">Reset 重新開始</button>
</div>
</div>
<button class="back-top" onclick="window.scrollTo({top:0,behavior:'smooth'})">↑</button>

<script>
const data = {
  Case1:{
    title:"Case 1 — 5 yr Girl · Psoriasis",
    titleZh:"案例一 — 5歲女童 · 銀屑病",
    desc:`Patient: 5 year old girl
Chief Complaint: Patient had broken out with psoriasis. Lesions are very red and spreading quickly. Covered in scales that shed easily; very itchy with burning pain.
Other Symptoms: Thirsty, wants cold water. Constipation (hard, dry, pellet-like stools). Red complexion, bad breath, dry lips, dark and scanty urine.
Tongue: Scarlet red with dry yellow coating
Pulse: Rapid, slippery, forceful`,
    questions:[
      {n:1,
       en:"According to 4-Level Differentiation, what is the syndrome differentiation of her psoriasis?",
       zh:"根據四級辨證，此患者銀屑病的辨證屬哪一層次？",
       comp:"Competency 6 – Diagnosis and Treatment",
       opts:{
         A:{en:"Wei Level (Defensive Qi Level)",zh:"衛分（防衛氣層次）"},
         B:{en:"Qi Level",zh:"氣分"},
         C:{en:"Ying Level (Nutritive Qi Level)",zh:"營分（營氣層次）"},
         D:{en:"Xue Level (Blood Level)",zh:"血分",excluded:true}
       },
       ans:"B",
       expl:{
         en:"The lesions show intense redness, thirst for cold water, constipation, dark urine, scarlet tongue with dry yellow coat, and a rapid forceful slippery pulse — all hallmarks of <strong>Heat excess at the Qi Level</strong>. The pathogen has not yet penetrated into Ying (nutritive) or Xue (blood) levels. D is excluded as it is confirmed not the answer.",
         zh:"皮損鮮紅、口渴喜冷、便秘、尿黃、舌猩紅苔乾黃、脈數滑有力——均為<strong>熱邪盛於氣分</strong>的典型表現。熱邪尚未深入營血，故排除 C（營分）及 D（血分）。"
       }
      },
      {n:2,
       en:"What treatment principles would you use to treat her psoriasis?",
       zh:"治療銀屑病應採用哪種治則？",
       comp:"Competency 4 – TCM Foundations",
       opts:{
         A:{en:"Release the exterior, expel Heat, stop psoriasis, promote healing",zh:"解表散熱、止癬促癒"},
         B:{en:"Purge Heat, promote bowel movement, stop psoriasis, promote healing",zh:"瀉熱通腑、止癬促癒"},
         C:{en:"Clear Heat, nourish Yin, stop psoriasis, promote healing",zh:"清熱養陰、止癬促癒"},
         D:{en:"Cool the Blood, extinguish Wind, stop psoriasis, promote healing",zh:"涼血熄風、止癬促癒",excluded:true}
       },
       ans:"B",
       expl:{
         en:"The patient presents with <strong>Yangming Fu excess</strong> — hard dry pellet-like stools, yellow dry tongue coat, forceful pulse. Treatment must <strong>purge Heat and promote bowel movement</strong>. Cooling Blood (D) would be for Blood-Level patterns; nourishing Yin (C) for deficiency heat. Purging the bowels allows Heat to exit downward, relieving the skin lesions.",
         zh:"患者有明顯<strong>陽明腑實</strong>（便秘、乾硬如羊糞、苔黃、脈有力），治療需<strong>瀉熱通腑</strong>，使熱邪從下而出，皮損自然緩解。涼血（D）適用血分熱盛；養陰（C）適用虛熱，均不符合本案。"
       }
      },
      {n:3,
       en:"What formula would you use for her psoriasis?",
       zh:"此案應選用哪個方劑？",
       comp:"Competency 6 – Diagnosis and Treatment",
       opts:{
         A:{en:"Mai Wei Di Huang Tang 麥味地黃湯",zh:"麥味地黃湯"},
         B:{en:"Xiao Feng San 消風散",zh:"消風散"},
         C:{en:"Wu Wei Xiao Du Yin 五味消毒飲",zh:"五味消毒飲"},
         D:{en:"Xi Jiao / Shui Niu Jiao Di Huang Tang 犀角地黃湯",zh:"犀角（水牛角）地黃湯",excluded:true}
       },
       ans:"B",
       expl:{
         en:"<strong>Xiao Feng San (Eliminate Wind Powder)</strong> treats skin conditions with Wind-Heat and Dampness — itching, red lesions, scaling. It clears Heat, disperses Wind and resolves Dampness, directly matching this case's Qi-level excess pattern. Xi Jiao Di Huang Tang (D) is for Blood-level Heat with bleeding signs, which this patient does not have.",
         zh:"<strong>消風散</strong>主治風熱夾濕的皮膚瘙癢性疾患（發疹、紅斑、脫屑），清熱疏風除濕，切合本案氣分熱盛的皮疹。犀角地黃湯（D）用於血分熱盛兼出血，本案無此表現，不適用。"
       }
      },
      {n:4,
       en:"What other modality is best for her?",
       zh:"對此患者最適合的其他療法是什麼？",
       comp:"Competency 6 – Diagnosis and Treatment",
       opts:{
         A:{en:"Moxibustion 艾灸",zh:"艾灸"},
         B:{en:"Cupping 拔罐",zh:"拔罐"},
         C:{en:"Tuina 推拿",zh:"推拿（小兒推拿）",excluded:true},
         D:{en:"Electro-acupuncture 電針",zh:"電針"}
       },
       ans:"C",
       expl:{
         en:"Although C is marked 【X】 (not the answer in the original exclusion), the recorded correct answer is <strong>C — Tuina (Pediatric Tui Na)</strong>. For a 5-year-old, needle retention and electro-acupuncture are poorly tolerated; moxibustion adds Heat to an already Heat-excess case. <strong>Pediatric Tui Na</strong> is the standard first-line non-pharmaceutical modality in Chinese pediatrics — safe, effective, and non-invasive.",
         zh:"雖然原題標注【X】（排除記號），但記錄的正確答案仍為 <strong>C — 小兒推拿</strong>。5歲患兒難以配合留針及電針；艾灸更會加重熱象。<strong>小兒推拿</strong>是中醫兒科首選的非藥物療法，安全無創，為兒科標準治療。"
       }
      },
      {n:5,
       en:"Which set of acupuncture points is best for her constipation?",
       zh:"哪組穴位最適合治療其便秘？",
       comp:"Competency 6 – Diagnosis and Treatment",
       opts:{
         A:{en:"TE6, ST25, SP15, ST44, LI4, ST36, ST37, ST40",zh:"TE6 支溝，ST25 天樞，SP15 大橫，ST44 內庭，LI4 合谷，ST36 足三里，ST37 上巨虛，ST40 豐隆"},
         B:{en:"ST25, CV6, TE6, GB34, ST37, LR3, LR5",zh:"ST25 天樞，CV6 氣海，TE6 支溝，GB34 陽陵泉，ST37，LR3 太衝，LR5"},
         C:{en:"ST25, SP15, CV6, CV12, ST36, SP6, BL13, BL20, BL25",zh:"ST25，SP15，CV6，CV12，ST36，SP6，BL13，BL20，BL25"},
         D:{en:"ST25, CV4",zh:"ST25 天樞，CV4 關元"}
       },
       ans:"A",
       expl:{
         en:"Option A targets <strong>Heat-excess constipation</strong> in the Yangming pattern: <strong>TE6</strong> (Zhigou) — the key point for constipation; <strong>ST25</strong> — Front-Mu of Large Intestine; <strong>LI4</strong> — clears Yangming Heat; <strong>ST44</strong> — clears Stomach Fire; ST36/37/40 support intestinal function. This combination purges Heat and unblocks the bowels.",
         zh:"A組針對<strong>陽明腑實型便秘</strong>：<strong>TE6 支溝</strong>——通便要穴；<strong>ST25 天樞</strong>——大腸募穴；<strong>LI4 合谷</strong>——清陽明熱；<strong>ST44 內庭</strong>——清胃火；ST36/37/40輔助腸道功能。此組合清熱通腑，最為切合。"
       }
      },
      {n:6,
       en:"For a child of this age, what percentage of the adult herbal dose should you prescribe?",
       zh:"對此年齡的兒童，應處方成人劑量的多少？",
       comp:"Competency 9 – Safety",
       opts:{
         A:{en:"100%",zh:"100%"},
         B:{en:"75%",zh:"75%"},
         C:{en:"50%",zh:"50%"},
         D:{en:"33%",zh:"33%（約1/3）"}
       },
       ans:"D",
       expl:{
         en:"In TCM pediatric dosing guidelines, children <strong>under 5 years old</strong> receive approximately <strong>1/3 (33%) of the adult dose</strong>. This protects the child's delicate constitution (稚陰稚陽) from over-treatment while maintaining therapeutic efficacy.",
         zh:"中醫兒科劑量原則：<strong>5歲以下</strong>用成人劑量的<strong>1/3（約33%）</strong>。兒童稚陰稚陽之體，臟腑嬌嫩，用藥宜輕，避免劑量過重傷正氣。"
       }
      },
      {n:7,
       en:"Which statement is true about advertisement for TCM practitioners?",
       zh:"關於中醫師廣告宣傳，哪個陳述是正確的？",
       comp:"Competency 2 – Professionalism",
       opts:{
         A:{en:"Before and after pictures must not show the girl's face",zh:"治療前後照片不得顯示該女童的臉"},
         B:{en:"You can only use the patient's written testimonial on your website, but not pictures",zh:"只可在網站使用患者文字見證，不可使用照片"},
         C:{en:"You can claim you are an expert in treating psoriasis",zh:"可以聲稱自己是治療銀屑病的專家"},
         D:{en:"None of the above are permitted",zh:"以上皆不允許"}
       },
       ans:"D",
       expl:{
         en:"Under TCM professional advertising regulations: (A) patient photos — including minors — are <strong>not permitted at all</strong>, not just restricted to hiding the face; (B) written patient testimonials are also <strong>prohibited</strong>; (C) claiming 'expert' status violates standards. Therefore <strong>none of the above are allowed</strong>.",
         zh:"依中醫師職業廣告守則：（A）患者照片（包括未成年人）<strong>完全不得使用</strong>，不僅僅是隱藏臉部；（B）患者文字見證同樣<strong>禁止</strong>；（C）自稱「專家」違反規範。故以上<strong>皆不允許</strong>。"
       }
      },
      {n:8,
       en:"Based on these findings, what is the MOST appropriate next step?",
       zh:"基於目前的發現，最適切的下一步是什麼？",
       comp:"Safety / Clinical Reasoning",
       opts:{
         A:{en:"Diagnose Heat Toxin and Blood Heat; initiate aggressive Heat-clearing treatment",zh:"診斷熱毒血熱，開始積極清熱治療"},
         B:{en:"Continue with the same formula but add a topical formula",zh:"繼續原方，另加外用藥"},
         C:{en:"Perform acupuncture distal to the lesion",zh:"在皮損遠端施針"},
         D:{en:"Refer the child to urgent care or the emergency department",zh:"轉介至緊急護理或急診"}
       },
       ans:"D",
       expl:{
         en:"When a child presents with <strong>rapidly spreading, extensive skin lesions</strong> with systemic signs (fever, severe constipation, intense erythema), the <strong>safest and most appropriate step is immediate referral</strong> to rule out emergent conditions such as erythrodermic psoriasis or secondary infection. Clinical safety always takes priority over initiating treatment.",
         zh:"當患兒出現<strong>快速擴散的大面積皮損</strong>加上全身症狀（高熱、嚴重便秘、皮膚劇烈紅腫），首要原則是<strong>確保安全，立即轉介急診</strong>，以排除紅皮病型銀屑病或繼發感染等緊急狀況。臨床安全優先於開始治療。"
       }
      }
    ]
  },

  Case2:{
    title:"Case 2 — 37 yr Female · Habitual Miscarriage",
    titleZh:"案例二 — 37歲女性 · 習慣性流產",
    desc:`Patient: 37 year old female
Chief Complaint: Infertility — trying to conceive for over 2 years. Tried IVF 5 times; became pregnant each time but lost all pregnancies in the first trimester. No identifiable cause found.
Other Symptoms: Feels cold, sweats easily, poor digestion, loose stools, frequent urination, low back soreness. Irregular menses with cramps (better with warmth), dark clots.
Tongue: Pale-purple, thin white coating, swollen, with teethmarks
Pulse: Deep, weak, wiry`,
    questions:[
      {n:9,
       en:"What is the patient's TCM disease?",
       zh:"患者的中醫病名是什麼？",
       comp:"Competency 4 – TCM Foundations",
       opts:{
         A:{en:"Threatened Miscarriage 胎動不安",zh:"先兆流產（胎動不安）"},
         B:{en:"Habitual Miscarriage 滑胎",zh:"習慣性流產（滑胎）"},
         C:{en:"Infertility 不孕症",zh:"不孕症"},
         D:{en:"Dysmenorrhea 痛經",zh:"痛經"}
       },
       ans:"B",

      let optsHtml = '';
      Object.entries(q.opts).forEach(([key, val]) => {
        const excl = val.excluded ? ' excluded' : '';
        const exclNote = val.excluded ? ' <span style="font-size:.76em;opacity:.6">[Excluded 排除]</span>' : '';
        optsHtml += `
          <div class="opt${excl}" id="opt-${qid}-${key}" onclick="pick('${qid}','${key}','${id}',${!!isMulti})">
            <div class="opt-key">${key}.</div>
            <div class="opt-content">
              <div class="opt-en">${val.en}${exclNote}</div>
              <div class="opt-zh">${val.zh}</div>
            </div>
          </div>`;
      });

      html += `
        <div class="qcard" id="qcard-${qid}">
          <div class="q-head">
            <div class="q-num">${q.n}</div>
            <div class="q-body">
              <div class="q-en">${q.en}</div>
              <div class="q-zh">${q.zh}</div>
              <div style="font-size:.76em;color:var(--sage-light);margin-top:3px;">${q.comp||''}</div>
              ${multiBadge}
              ${warnBadge}
            </div>
          </div>
          <div class="opts" id="opts-${qid}">${optsHtml}</div>
          <div class="fb" id="fb-${qid}"></div>
          <button class="expl-btn" id="explbtn-${qid}" onclick="toggleExpl('${qid}','${id}',${q.questions ? JSON.stringify(q.questions) : 'null'})">
            <span>Show Explanation 顯示解析</span><span class="arrow">▼</span>
          </button>
          <div class="expl-box" id="expl-${qid}">
            <div class="expl-en"><span class="expl-lang">ENGLISH EXPLANATION</span><div class="expl-text">${q.expl.en}</div></div>
            <div class="expl-zh"><span class="expl-lang">中文解析</span><div class="expl-text">${q.expl.zh}</div></div>
          </div>
        </div>`;
    });

    panel.innerHTML = html;
    panelsEl.appendChild(panel);
  });
}

function loadCase(id){
  current = id;
  answers[id] = answers[id] || {};

  document.querySelectorAll('.tab').forEach(t => t.classList.remove('active'));
  document.getElementById('tab-'+id).classList.add('active');
  document.querySelectorAll('.panel').forEach(p => p.classList.remove('active'));
  document.getElementById('panel-'+id).classList.add('active');
  document.getElementById('actions').style.display = 'flex';

  // Remove old score
  const old = document.getElementById('panel-'+id).querySelector('.score-box');
  if(old) old.remove();

  setTimeout(() => {
    document.getElementById('panel-'+id).scrollIntoView({behavior:'smooth',block:'start'});
  }, 80);
}

function pick(qid, key, caseId, isMulti){
  if(!answers[caseId]) answers[caseId] = {};
  const optEl = document.getElementById('opt-'+qid+'-'+key);
  if(!optEl || optEl.classList.contains('excluded')) return;
  // If already checked (graded), don't allow
  if(optEl.classList.contains('correct') || optEl.classList.contains('wrong')) return;

  if(isMulti){
    if(!answers[caseId][qid]) answers[caseId][qid] = [];
    optEl.classList.toggle('selected');
    if(optEl.classList.contains('selected')){
      if(!answers[caseId][qid].includes(key)) answers[caseId][qid].push(key);
    } else {
      answers[caseId][qid] = answers[caseId][qid].filter(k => k!==key);
    }
  } else {
    const allOpts = document.querySelectorAll(`[id^="opt-${qid}-"]`);
    allOpts.forEach(o => o.classList.remove('selected'));
    optEl.classList.add('selected');
    answers[caseId][qid] = key;
  }
}

function toggleExpl(qid, caseId, _){
  const box = document.getElementById('expl-'+qid);
  const btn = document.getElementById('explbtn-'+qid);
  const isOpen = box.classList.contains('show');
  box.classList.toggle('show', !isOpen);
  btn.classList.toggle('open', !isOpen);
  btn.querySelector('span').textContent = isOpen ? 'Show Explanation 顯示解析' : 'Hide Explanation 隱藏解析';
}

function checkAll(){
  if(!current) return;
  const caseData = data[current];
  let correct = 0, total = 0;

  caseData.questions.forEach(q => {
    const qid = current+'-Q'+q.n;
    const userAns = answers[current]?.[qid];
    const correctAns = q.ans;
    const isMulti = q.multi;

    let isCorrect = false;
    if(isMulti){
      const corr = correctAns.split(',').sort().join(',');
      const user = Array.isArray(userAns) ? [...userAns].sort().join(',') : '';
      isCorrect = corr === user;
    } else {
      isCorrect = userAns === correctAns;
    }

    // Mark options
    const corrKeys = correctAns.split(',');
    corrKeys.forEach(k => {
      const el = document.getElementById('opt-'+qid+'-'+k);
      if(el) { el.classList.remove('selected'); el.classList.add('correct'); }
    });
    if(isMulti && Array.isArray(userAns)){
      userAns.forEach(k => {
        if(!corrKeys.includes(k)){
          const el = document.getElementById('opt-'+qid+'-'+k);
          if(el) { el.classList.remove('selected'); el.classList.add('wrong'); }
        }
      });
    } else if(!isMulti && userAns && !corrKeys.includes(userAns)){
      const el = document.getElementById('opt-'+qid+'-'+userAns);
      if(el) { el.classList.remove('selected'); el.classList.add('wrong'); }
    }

    // Feedback
    const fb = document.getElementById('fb-'+qid);
    fb.classList.add('show');
    if(isCorrect){
      correct++;
      fb.className = 'fb show ok';
      fb.textContent = '✓ Correct! 正確！';
    } else {
      fb.className = 'fb show no';
      fb.textContent = `✗ Correct answer: ${correctAns} ｜ 正確答案：${correctAns}`;
    }
    total++;
  });

  // Score
  const pct = Math.round(correct/total*100);
  const scoreHtml = `<div class="score-box"><h3>Test Results · 測驗結果</h3><div class="score-num">${correct} / ${total}</div><div class="score-pct">Accuracy 正確率：${pct}%</div></div>`;
  const panel = document.getElementById('panel-'+current);
  const old = panel.querySelector('.score-box');
  if(old) old.remove();
  panel.insertAdjacentHTML('afterbegin', scoreHtml);
  panel.querySelector('.score-box').scrollIntoView({behavior:'smooth',block:'center'});
}

function resetAll(){
  if(!current) return;
  answers[current] = {};
  const panel = document.getElementById('panel-'+current);

  panel.querySelectorAll('.opt').forEach(o => o.classList.remove('selected','correct','wrong'));
  panel.querySelectorAll('.fb').forEach(f => { f.classList.remove('show','ok','no'); f.textContent=''; });
  panel.querySelectorAll('.expl-box').forEach(b => b.classList.remove('show'));
  panel.querySelectorAll('.expl-btn').forEach(b => {
    b.classList.remove('open');
    b.querySelector('span').textContent = 'Show Explanation 顯示解析';
  });
  const score = panel.querySelector('.score-box');
  if(score) score.remove();
  panel.scrollIntoView({behavior:'smooth',block:'start'});
}

document.addEventListener('DOMContentLoaded', init);
</script>
</body>
</html>
