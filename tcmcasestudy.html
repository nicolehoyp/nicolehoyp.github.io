        :root {
            --sage-dark: #2d4a3e;
            --sage-medium: #4a6b5c;
            --sage-light: #7a9b8a;
            --paper-cream: #faf7f2;
            --ink-black: #1a1a1a;
            --cinnabar-red: #c1440e;
            --gold-accent: #d4a574;
            --shadow-soft: rgba(45, 74, 62, 0.08);
        }
        
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        
        body {
            font-family: 'Noto Sans TC', 'Crimson Pro', serif;
            background: linear-gradient(135deg, var(--paper-cream) 0%, #f0ebe3 100%);
            color: var(--ink-black);
            line-height: 1.7;
            min-height: 100vh;
            position: relative;
        }
        
        body::before {
            content: '';
            position: fixed;
            top: 0;
            left: 0;
            right: 0;
            bottom: 0;
            background-image: 
                radial-gradient(circle at 20% 80%, rgba(212, 165, 116, 0.03) 0%, transparent 50%),
                radial-gradient(circle at 80% 20%, rgba(122, 155, 138, 0.04) 0%, transparent 50%);
            pointer-events: none;
            z-index: 0;
        }
        
        .container {
            max-width: 1100px;
            margin: 0 auto;
            padding: 40px 20px;
            position: relative;
            z-index: 1;
        }
        
        header {
            text-align: center;
            padding: 60px 20px;
            border-bottom: 2px solid var(--sage-light);
            margin-bottom: 50px;
            background: linear-gradient(to bottom, rgba(250, 247, 242, 0.8), transparent);
            animation: fadeInDown 0.8s ease;
        }
        
        h1 {
            font-family: 'Crimson Pro', serif;
            font-size: 3.2em;
            font-weight: 700;
            color: var(--sage-dark);
            margin-bottom: 15px;

        .subtitle {
            font-size: 1.1em;
            color: var(--sage-medium);
            font-weight: 400;
            letter-spacing: 2px;
        }

            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(240px, 1fr));
            gap: 20px;
            margin-bottom: 50px;
            animation: fadeIn 1s ease 0.3s backwards;
        }
        
        .case-btn {
            background: white;
            border: 2px solid var(--sage-light);
            padding: 25px;
            border-radius: 12px;
            cursor: pointer;
            transition: all 0.4s cubic-bezier(0.4, 0, 0.2, 1);
            box-shadow: 0 2px 8px var(--shadow-soft);
            position: relative;
            overflow: hidden;
        }
        
        .case-btn::before {
            content: '';
            position: absolute;
            top: 0;
            left: -100%;
            width: 100%;
            height: 100%;
            background: linear-gradient(90deg, transparent, rgba(122, 155, 138, 0.1), transparent);
            transition: left 0.6s;
        }
        
        .case-btn:hover::before {
            left: 100%;
        }
        
        .case-btn:hover {
            transform: translateY(-5px);
            box-shadow: 0 8px 20px rgba(45, 74, 62, 0.15);
            border-color: var(--sage-dark);
        }
        
        .case-btn.active {
            background: var(--sage-dark);
            color: white;
            border-color: var(--sage-dark);
            transform: scale(1.02);
        }
        
        .case-title {
            font-size: 1.3em;
            font-weight: 700;
            margin-bottom: 10px;
            color: var(--sage-dark);
        }
        
        .case-btn.active .case-title,
        .case-btn.active .case-info {
            color: white;
        }
        
        .case-info {
            font-size: 0.9em;
            color: var(--sage-medium);
        }
        
        .case-content {
            display: none;
            animation: fadeInUp 0.6s ease;
        }
        
        .case-content.active {
            display: block;
        }
        
        .case-description {
            background: white;
            padding: 35px;
            border-radius: 16px;
            margin-bottom: 40px;
            border-left: 5px solid var(--cinnabar-red);
            box-shadow: 0 4px 12px var(--shadow-soft);
            line-height: 1.9;
            transition: all 0.3s ease;
        }
        
        .case-description.sticky-active {
            position: fixed;
            top: 20px;
            left: 50%;
            transform: translateX(-50%);
            width: calc(100% - 40px);
            max-width: 1060px;
            z-index: 100;
            box-shadow: 0 8px 25px rgba(45, 74, 62, 0.25);
        }
        
        .case-description-placeholder {
            display: none;
        }

            display: block;
            height: 0;
            margin-bottom: 40px;
        }
        
        .case-description h3 {
            color: var(--sage-dark);
            font-size: 1.5em;
            margin-bottom: 20px;
            font-weight: 600;
        }

            color: var(--ink-black);
            font-size: 1.05em;
        }

            animation: fadeInUp 0.5s ease backwards;
        }

        .question-card:nth-child(2) { animation-delay: 0.15s; }
        .question-card:nth-child(3) { animation-delay: 0.2s; }
        .question-card:nth-child(4) { animation-delay: 0.25s; }

            align-items: flex-start;
            margin-bottom: 20px;
            gap: 15px;
        }

            color: white;
            width: 40px;
            height: 40px;
            border-radius: 50%;

            align-items: center;
            justify-content: center;
            font-weight: 700;
            font-size: 1.1em;
            flex-shrink: 0;

            font-size: 1.15em;
            font-weight: 500;
            color: var(--sage-dark);
            line-height: 1.6;

            height: 28px;

            justify-content: center;

            font-size: 0.9em;

            font-size: 3.5em;
            font-weight: 700;
            color: var(--cinnabar-red);
            margin: 20px 0;
            font-family: 'IBM Plex Mono', monospace;
        }
        
        .score-details {
            color: var(--sage-medium);
            font-size: 1.1em;
            margin-top: 15px;
        }

            from {
                opacity: 0;
            }
            to {
                opacity: 1;
            }

            from {
                opacity: 0;
                transform: translateY(-30px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

            from {
                opacity: 0;
                transform: translateY(30px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }
        
        @keyframes slideIn {
            from {
                opacity: 0;
                transform: translateX(-20px);
            }
            to {
                opacity: 1;
                transform: translateX(0);
            }
        }

            0% {

            }
            100% {

            }
        }

            h1 {

            }

                grid-template-columns: 1fr;
            }
            
            .question-card {
                padding: 25px 20px;
            }
            
            .action-buttons {
                flex-direction: column;
            }
            
            .btn {
                width: 100%;
            }
            
            .case-description.sticky-active {
                width: calc(100% - 40px);
                padding: 25px 20px;
            }
        }
    </style>
</head>

        let currentCase = null;
        let userAnswers = {};

        function initializeCaseSelector() {
            const selector = document.getElementById('caseSelector');
            const cases = [
                { id: 'Case1', title: '案例一 Case 1', info: '5歲女童 - 銀屑病 (Psoriasis)' },
                { id: 'Case2', title: '案例二 Case 2', info: '37歲女性 - 習慣性流產 (Habitual Miscarriage)' },
                { id: 'Case3', title: '案例三 Case 3', info: '男性患者 - 慢性腹瀉 (Chronic Diarrhea)' },
                { id: 'Case4', title: '案例四 Case 4', info: '29歲男性 - 急性發熱性疾病 (Acute Febrile Illness)' }
            ];

            cases.forEach(caseInfo => {
                const btn = document.createElement('div');
                btn.className = 'case-btn';
                btn.innerHTML = `
                    <div class="case-title">${caseInfo.title}</div>
                    <div class="case-info">${caseInfo.info}</div>
                `;
                btn.onclick = () => loadCase(caseInfo.id);
                selector.appendChild(btn);
            });
        }

        function loadCase(caseId) {
            currentCase = caseId;
            userAnswers = {};
            
            // Update button states
            document.querySelectorAll('.case-btn').forEach(btn => btn.classList.remove('active'));
            event.currentTarget.classList.add('active');
            
            // Hide all case contents and reset sticky states
            document.querySelectorAll('.case-content').forEach(content => {
                content.classList.remove('active');
                const desc = content.querySelector('.case-description');
                const placeholder = content.querySelector('.case-description-placeholder');
                if (desc) {
                    desc.classList.remove('sticky-active');
                    delete desc.dataset.originalTop;
                }
                if (placeholder) {
                    placeholder.classList.remove('active');
                    placeholder.style.height = '0';
                }
            });
            
            // Create or show case content
            let caseContent = document.getElementById(`content-${caseId}`);
            if (!caseContent) {
                caseContent = createCaseContent(caseId);
                document.getElementById('caseContainer').appendChild(caseContent);
            }
            caseContent.classList.add('active');
            
            document.getElementById('actionButtons').style.display = 'flex';
            
            // Smooth scroll to content
            setTimeout(() => {
                caseContent.scrollIntoView({ behavior: 'smooth', block: 'start' });
                // Initialize sticky check after scroll
                setTimeout(() => {
                    handleStickyDescription();
                }, 600);
            }, 100);
        }

        function createCaseContent(caseId) {
            const data = caseData[caseId];
            const content = document.createElement('div');
            content.id = `content-${caseId}`;
            content.className = 'case-content active';
            
            let html = `
                <div class="case-description" id="case-desc-${caseId}">
                    <h3>病例描述 Case Description</h3>
                    <p>${data.description}</p>
                </div>
                <div class="case-description-placeholder" id="placeholder-${caseId}"></div>
            `;
            
            data.questions.forEach(q => {
                html += createQuestionHTML(caseId, q);
            });
            
            content.innerHTML = html;
            return content;
        }

        function createQuestionHTML(caseId, question) {
            const qId = `${caseId}-Q${question.question_number}`;
            let html = `
                <div class="question-card" id="${qId}">
                    <div class="question-header">
                        <div class="question-number">${question.question_number}</div>
                        <div class="question-text">${question.question}</div>
                        <div class="info-icon" onclick="showCaseDescription('${caseId}')">i</div>
                    </div>
                    <div class="options">
            `;
            
            if (question.options) {
                for (let [key, value] of Object.entries(question.options)) {
                    html += `
                        <div class="option" onclick="selectOption('${qId}', '${key}', ${question.question.includes('Choose')})">
                            <span class="option-label">${key}.</span>
                            <span class="option-text">${value}</span>
                        </div>
                    `;
                }
            }
            
            html += `
                    </div>
                    <div class="feedback" id="feedback-${qId}"></div>
                </div>
            `;
            
            return html;
        }

        function selectOption(questionId, option, isMultiple) {
            const questionCard = document.getElementById(questionId);
            const options = questionCard.querySelectorAll('.option');
            
            if (isMultiple) {
                // Multiple choice
                const clickedOption = Array.from(options).find(opt => 
                    opt.querySelector('.option-label').textContent === option + '.'
                );
                
                if (clickedOption.classList.contains('selected')) {
                    clickedOption.classList.remove('selected');
                    if (!userAnswers[questionId]) userAnswers[questionId] = [];
                    userAnswers[questionId] = userAnswers[questionId].filter(ans => ans !== option);
                } else {
                    clickedOption.classList.add('selected');
                    if (!userAnswers[questionId]) userAnswers[questionId] = [];
                    if (!userAnswers[questionId].includes(option)) {
                        userAnswers[questionId].push(option);
                    }
                }
            } else {
                // Single choice
                options.forEach(opt => opt.classList.remove('selected'));
                const clickedOption = Array.from(options).find(opt => 
                    opt.querySelector('.option-label').textContent === option + '.'
                );
                clickedOption.classList.add('selected');
                userAnswers[questionId] = option;
            }
        }

        function checkAnswers() {
            const data = caseData[currentCase];
            let correct = 0;
            let total = data.questions.length;
            
            data.questions.forEach(q => {
                const qId = `${currentCase}-Q${q.question_number}`;
                const questionCard = document.getElementById(qId);
                const feedback = document.getElementById(`feedback-${qId}`);
                const options = questionCard.querySelectorAll('.option');
                
                const correctAnswer = q.answer;
                const userAnswer = userAnswers[qId];
                
                let isCorrect = false;
                
                if (correctAnswer.includes(',')) {
                    // Multiple choice
                    const correctAnswers = correctAnswer.split(',').sort().join(',');
                    const userAnswerStr = Array.isArray(userAnswer) ? userAnswer.sort().join(',') : '';
                    isCorrect = correctAnswers === userAnswerStr;
                } else {
                    // Single choice
                    isCorrect = userAnswer === correctAnswer;
                }
                
                // Mark options
                options.forEach(opt => {
                    const optionLabel = opt.querySelector('.option-label').textContent.replace('.', '');
                    
                    if (correctAnswer.includes(',')) {
                        const correctAnswers = correctAnswer.split(',');
                        if (correctAnswers.includes(optionLabel)) {
                            opt.classList.add('correct');
                        }
                        if (Array.isArray(userAnswer) && userAnswer.includes(optionLabel) && !correctAnswers.includes(optionLabel)) {
                            opt.classList.add('incorrect');
                        }
                    } else {
                        if (optionLabel === correctAnswer) {
                            opt.classList.add('correct');
                        }
                        if (optionLabel === userAnswer && optionLabel !== correctAnswer) {
                            opt.classList.add('incorrect');
                        }
                    }
                });
                
                // Show feedback
                feedback.classList.add('show');
                if (isCorrect) {
                    correct++;
                    feedback.className = 'feedback show correct';
                    feedback.textContent = '✓ 正確！Correct!';
                } else {
                    feedback.className = 'feedback show incorrect';
                    if (correctAnswer.includes(',')) {
                        feedback.textContent = `✗ 正確答案 Correct answers: ${correctAnswer}`;
                    } else {
                        feedback.textContent = `✗ 正確答案 Correct answer: ${correctAnswer}`;
                    }
                }
            });
            
            // Show score
            showScore(correct, total);
        }

        function showScore(correct, total) {
            const percentage = Math.round((correct / total) * 100);
            const scoreHTML = `
                <div class="score-summary">
                    <h3>測驗結果 Test Results</h3>
                    <div class="score-display">${correct} / ${total}</div>
                    <div class="score-details">正確率 Accuracy: ${percentage}%</div>
                </div>
            `;
            
            const caseContent = document.getElementById(`content-${currentCase}`);
            const existingScore = caseContent.querySelector('.score-summary');
            if (existingScore) {
                existingScore.remove();
            }
            caseContent.insertAdjacentHTML('afterbegin', scoreHTML);
            
            // Scroll to score
            setTimeout(() => {
                caseContent.querySelector('.score-summary').scrollIntoView({ behavior: 'smooth', block: 'center' });
            }, 100);
        }

        function resetTest() {
            if (!currentCase) return;
            
            userAnswers = {};
            const caseContent = document.getElementById(`content-${currentCase}`);
            
            // Remove all selections and feedback
            caseContent.querySelectorAll('.option').forEach(opt => {
                opt.classList.remove('selected', 'correct', 'incorrect');
            });
            
            caseContent.querySelectorAll('.feedback').forEach(fb => {
                fb.classList.remove('show');
            });
            
            // Remove score
            const score = caseContent.querySelector('.score-summary');
            if (score) score.remove();
            
            // Scroll to top
            caseContent.scrollIntoView({ behavior: 'smooth', block: 'start' });
        }
        
        function showCaseDescription(caseId) {
            const caseDescElement = document.getElementById(`case-desc-${caseId}`);
            
            if (caseDescElement) {
                // Smooth scroll to the case description
                caseDescElement.scrollIntoView({ 
                    behavior: 'smooth', 
                    block: 'center' 
                });
                
                // Add a highlight animation
                caseDescElement.style.animation = 'none';
                setTimeout(() => {
                    caseDescElement.style.animation = 'highlightPulse 1.5s ease';
                }, 10);
            }
        }
        
        // Handle sticky behavior for case description
        let lastScrollTop = 0;
        
        function handleStickyDescription() {
            if (!currentCase) return;
            
            const caseDescElement = document.getElementById(`case-desc-${currentCase}`);
            const placeholder = document.getElementById(`placeholder-${currentCase}`);
            const caseContent = document.getElementById(`content-${currentCase}`);
            
            if (!caseDescElement || !placeholder || !caseContent) return;
            
            const scrollTop = window.pageYOffset || document.documentElement.scrollTop;
            const caseContentRect = caseContent.getBoundingClientRect();
            const caseDescHeight = caseDescElement.offsetHeight;
            
            // Get the original position of case description
            if (!caseDescElement.dataset.originalTop) {
                const rect = caseDescElement.getBoundingClientRect();
                caseDescElement.dataset.originalTop = rect.top + scrollTop;
            }
            
            const originalTop = parseFloat(caseDescElement.dataset.originalTop);
            
            // Check if we've scrolled past the case description
            const shouldBeSticky = scrollTop > originalTop - 20;
            
            // Check if we're still within the case content area
            const isInCaseContent = caseContentRect.top < window.innerHeight && caseContentRect.bottom > 0;
            
            if (shouldBeSticky && isInCaseContent) {
                // Make it sticky
                if (!caseDescElement.classList.contains('sticky-active')) {
                    placeholder.style.height = caseDescHeight + 'px';
                    placeholder.classList.add('active');
                    caseDescElement.classList.add('sticky-active');
                }
            } else {
                // Remove sticky
                if (caseDescElement.classList.contains('sticky-active')) {
                    placeholder.style.height = '0';
                    placeholder.classList.remove('active');
                    caseDescElement.classList.remove('sticky-active');
                    // Reset the original top when going back
                    delete caseDescElement.dataset.originalTop;
                }
            }
            
            lastScrollTop = scrollTop;
        }
        
        // Add scroll listener with throttling
        let scrollTimeout;
        let isScrolling = false;
        
        window.addEventListener('scroll', function() {
            if (!isScrolling) {
                window.requestAnimationFrame(function() {
                    handleStickyDescription();
                    isScrolling = false;
                });
                isScrolling = true;
            }
        }, { passive: true });

        // Initialize on load
        document.addEventListener('DOMContentLoaded', initializeCaseSelector);
    </script>
